<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" />
    <meta name="description" content="Research NSE stocks with a team of AI analysts: screening, a bull and bear debate, a reasoned verdict and a sized trade plan." />
    <meta property="og:title" content="Arena, stock research for NSE" />
    <meta property="og:description" content="Screen NSE stocks and get a reasoned AI verdict with a trade plan." />
    <title>Arena</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      (function () {
        try {
          var m = localStorage.getItem("arena-theme") || "system";
          var light = m === "light" || (m === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-md focus:bg-surface focus:px-3 focus:py-2">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
